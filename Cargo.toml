[package]
name = "website"
authors = ["LeHuman"]
version = "0.1.0"
edition = "2024"
description = "This is my statically generated website"
repository = "https://github.com/LeHuman/website"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.41"
reposcrape = { version = "0.1.4" }
slug = "0.1.6"
tokio = "1.47.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
dotenvy = { version = "0.15.7", optional = true }
show-option = "0.2.0"

[features]
default = []
dot-env = ["dotenvy"]
